name: Validate DevKit OpenCode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills, commands, config, and links
        run: python scripts/validate.py

      - name: Check bash installer syntax and dry-run
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --target /tmp/devkit-test
          bash scripts/install.sh --target /tmp/devkit-core --core-only --skip-config --no-commands
